[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mclogwebviewer"
version = "0.1.0"
description = "Log Web Viewer to Minecraft Servers."
authors = [
    { name = "Zic Stardust", email = "me@zicstardust.com" }
]

requires-python = ">=3.14.8"

dependencies = [
    "flask>=3.1.3",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.2.3",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["static*", "templates*"]